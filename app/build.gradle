plugins {
    id 'com.android.application'
}

android {
    namespace 'com.partpulse.displaylauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.partpulse.displaylauncher"
        minSdk 21
        targetSdk 34
        versionCode 32
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.leanback:leanback:1.0.0'
    // OkHttp — used by SseUpdateService to maintain the SSE connection
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Core for NotificationCompat in SseUpdateService
    implementation 'androidx.core:core:1.12.0'
    // Pdfium engine for high-DPI PDF rasterisation
    implementation 'com.github.barteksc:pdfium-android:1.9.0'
}
